name: Build Android APK

# Builds a debug APK of Learnio using Capacitor and publishes it to the repo's
# Releases page so it can be downloaded directly.
#
# Triggers:
#   - Manually from the Actions tab (Run workflow)
#   - Automatically when the app changes on main -> updates the rolling
#     "apk-latest" pre-release
#   - On a version tag (e.g. v1.0.0) -> creates a named release with the APK
on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'
    branches:
      - main
    paths:
      - 'index.html'
      - 'css/**'
      - 'js/**'
      - 'icons/**'
      - 'manifest.webmanifest'
      - 'mobile/**'
      - '.github/workflows/build-android.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: npm install

      - name: Copy web app into www/
        run: npm run build:www

      - name: Add Android platform
        run: npx cap add android

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Generate launcher icons & splash
        run: |
          npm run gen:assets
          npx capacitor-assets generate --android || echo "asset generation skipped"

      - name: Build debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Rename APK with version
        run: |
          mkdir -p ../dist
          cp android/app/build/outputs/apk/debug/app-debug.apk ../dist/learnio.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: learnio-debug-apk
          path: dist/learnio.apk
          if-no-files-found: error

      # Publishes the APK to the repo's Releases page on every build.
      # Tagged builds (vX.Y.Z) get a named release; all other builds update a
      # rolling "apk-latest" pre-release you can always grab the newest from.
      - name: Publish APK to Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'apk-latest' }}
          name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'Learnio Android (latest build)' }}
          prerelease: ${{ !startsWith(github.ref, 'refs/tags/') }}
          body: |
            Latest debug APK of Learnio, built automatically from
            `${{ github.sha }}`.

            Download **learnio.apk** below and install it on your Android device
            (you may need to allow installing from unknown sources).
          files: dist/learnio.apk
          fail_on_unmatched_files: true
